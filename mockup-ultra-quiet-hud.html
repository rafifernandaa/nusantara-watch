<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nusantara Watch — Ultra-Quiet Spatial HUD Mockup (Technical Ink)</title>
<style>
  :root,
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-deepest: #07080d;
    --surface-page: #0b0d14;
    --surface-card: #11141c;
    --surface-raised: #1a1e28;
    --border-hairline: rgba(238, 240, 245, 0.08);
    --border-strong: rgba(238, 240, 245, 0.14);
    --text-primary: #eef0f5;
    --text-secondary: #a3a9b8;
    --text-muted: #7a8296;
    --accent: #ff5a36;
    --accent-soft: rgba(255, 90, 54, 0.14);
    --positive: #4cc38a;
    --negative: #e5484d;
    --map-land: #131722;
    --map-land-stroke: rgba(238, 240, 245, 0.10);
    --map-grid: rgba(238, 240, 245, 0.035);
    --panel-shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset;
  }

  :root[data-theme="light"] {
    color-scheme: light;
    --surface-deepest: #eceff4;
    --surface-page: #f5f7fa;
    --surface-card: #ffffff;
    --surface-raised: #eceff4;
    --border-hairline: rgba(17, 24, 39, 0.08);
    --border-strong: rgba(17, 24, 39, 0.14);
    --text-primary: #111827;
    --text-secondary: #4b5565;
    --text-muted: #6b7487;
    --accent: #c83b1b;
    --accent-soft: rgba(200, 59, 27, 0.10);
    --positive: #16a34a;
    --negative: #dc2626;
    --map-land: #e8ecf2;
    --map-land-stroke: rgba(17, 24, 39, 0.11);
    --map-grid: rgba(17, 24, 39, 0.045);
    --panel-shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 8px 24px rgba(0, 0, 0, 0.06);
  }

  :root[data-theme="dark"] .plate {
    --ground: #07080d;
    --ink: #eef0f5;
    --muted: #7a8296;
    --line: rgba(238, 240, 245, 0.08);
  }

  :root[data-theme="light"] .plate {
    --ground: #f5f7fa;
    --ink: #111827;
    --muted: #6b7487;
    --line: rgba(17, 24, 39, 0.08);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--surface-page);
    color: var(--text-primary);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: "JetBrains Mono", "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* Simulated 3D Archipelago Canvas */
  .viewport {
    position: fixed;
    inset: 0;
    background: var(--surface-page);
    transition: background-color 180ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .viewport svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Top Ultra-Quiet HUD Bar */
  .topbar {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    pointer-events: none;
  }

  .hud-group {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 12px;
    border-radius: 12px;
    background: var(--surface-card);
    border: 1px solid var(--border-hairline);
    box-shadow: var(--panel-shadow);
    transition: background-color 160ms cubic-bezier(0.22, 1, 0.36, 1), border-color 160ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  .brand {
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--text-primary);
    margin: 0;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: var(--positive);
    flex-shrink: 0;
  }

  .v-sep {
    width: 1px;
    height: 16px;
    background: var(--border-hairline);
  }

  .telemetry-line {
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .telemetry-line strong {
    font-weight: 500;
    color: var(--accent);
  }

  .ctrl-btn, .ctrl-select {
    height: 32px;
    padding: 0 12px;
    border-radius: 8px;
    border: 1px solid var(--border-hairline);
    background: var(--surface-raised);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: background-color 140ms cubic-bezier(0.22, 1, 0.36, 1), border-color 140ms cubic-bezier(0.22, 1, 0.36, 1), transform 120ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .ctrl-btn:hover, .ctrl-select:hover {
    border-color: var(--border-strong);
  }
  .ctrl-btn:active {
    transform: scale(0.975);
  }
  .ctrl-btn.primary {
    background: var(--text-primary);
    color: var(--surface-card);
    border-color: transparent;
  }
  .ctrl-select {
    padding-right: 24px;
    outline: none;
  }

  /* Right Inspector Panel (Empty-State Hairline Stage) */
  .inspector {
    position: fixed;
    top: 76px;
    right: 16px;
    bottom: 84px;
    width: 392px;
    z-index: 20;
    border-radius: 16px;
    background: var(--surface-card);
    border: 1px solid var(--border-hairline);
    box-shadow: var(--panel-shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .inspector-head {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border-hairline);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .inspector-title {
    margin: 0;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
  }
  .inspector-sub {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--text-secondary);
  }
  .meta-pill {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--surface-raised);
    border: 1px solid var(--border-hairline);
    border-radius: 4px;
    padding: 2px 8px;
    white-space: nowrap;
  }

  .inspector-body {
    flex: 1;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }

  /* Concept Switcher (3 Hairline Figures) */
  .seg-track {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    padding: 4px;
    border-radius: 10px;
    background: var(--surface-deepest);
    border: 1px solid var(--border-hairline);
  }
  .seg-btn {
    height: 32px;
    padding: 0 4px;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 140ms cubic-bezier(0.22, 1, 0.36, 1), color 140ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .seg-btn:hover { color: var(--text-secondary); }
  .seg-btn[aria-selected="true"] {
    background: var(--surface-raised);
    color: var(--text-primary);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset;
  }

  /* Hairline Plate */
  .plate-wrap {
    border-radius: 12px;
    background: var(--surface-deepest);
    border: 1px solid var(--border-hairline);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .plate {
    position: relative;
    border-radius: 8px;
    background: var(--ground);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .plate-tag {
    position: absolute;
    top: 10px;
    font-size: 11px;
    line-height: 1;
    pointer-events: none;
    z-index: 2;
  }
  #hl-name { left: 12px; color: var(--muted); }
  #hl-read { right: 12px; color: var(--ink); }
  #stage svg { display: block; width: 100%; height: auto; }

  .plate-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 4px;
  }
  .plate-controls label {
    font-size: 11px;
    color: var(--text-muted);
  }
  .plate-controls input[type="range"] {
    flex: 1;
    height: 20px;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
  }
  .plate-controls input[type="range"]::-webkit-slider-runnable-track {
    height: 1px;
    background: var(--border-strong);
  }
  .plate-controls input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    margin-top: -5px;
    border-radius: 50%;
    background: var(--surface-card);
    border: 1.5px solid var(--text-primary);
  }
  .mini-btn {
    height: 24px;
    padding: 0 8px;
    border-radius: 6px;
    border: 1px solid var(--border-hairline);
    background: var(--surface-card);
    color: var(--text-secondary);
    font-size: 11px;
    cursor: pointer;
  }
  .mini-btn[aria-pressed="true"] {
    background: var(--text-primary);
    color: var(--surface-card);
    border-color: var(--text-primary);
  }
  .means-line {
    margin: 0;
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.4;
  }

  /* Summary Grid (3 Compact Cards) */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .stat-cell {
    border-radius: 10px;
    background: var(--surface-raised);
    border: 1px solid var(--border-hairline);
    padding: 10px 12px;
  }
  .stat-label {
    font-size: 11px;
    color: var(--text-muted);
    display: block;
  }
  .stat-val {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-primary);
    margin-top: 2px;
    display: block;
  }
  .stat-val.accent { color: var(--accent); }

  .hint-box {
    margin-top: auto;
    border-radius: 10px;
    background: var(--surface-deepest);
    border: 1px solid var(--border-hairline);
    padding: 10px 12px;
    font-size: 12px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .kbd {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--surface-raised);
    border: 1px solid var(--border-hairline);
    border-radius: 4px;
    padding: 1px 6px;
  }

  /* Bottom Ultra-Quiet Scrubber & Layer Bar */
  .bottombar {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 16px;
    z-index: 20;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }
  .dock {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 12px;
    height: 52px;
    padding: 0 12px;
    border-radius: 14px;
    background: var(--surface-card);
    border: 1px solid var(--border-hairline);
    box-shadow: var(--panel-shadow);
    max-width: 860px;
    width: 100%;
  }
  .layers {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .layer-btn {
    height: 32px;
    padding: 0 10px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-secondary);
    font-size: 12px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: background-color 140ms cubic-bezier(0.22, 1, 0.36, 1), color 140ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  .layer-btn[aria-pressed="true"] {
    background: var(--surface-raised);
    color: var(--text-primary);
    border-color: var(--border-hairline);
  }
  .layer-dot {
    width: 6px;
    height: 6px;
    border-radius: 999px;
    background: var(--text-muted);
  }
  .layer-btn[aria-pressed="true"] .layer-dot.hot { background: var(--accent); }
  .layer-btn[aria-pressed="true"] .layer-dot.peat { background: var(--positive); }
  .layer-btn[aria-pressed="true"] .layer-dot.sirup { background: #d4a72c; }

  .scrubber {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 180px;
  }
  .track {
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--surface-raised);
    position: relative;
  }
  .track-fill {
    width: 72%;
    height: 100%;
    border-radius: 2px;
    background: var(--accent);
  }
  .track-thumb {
    position: absolute;
    left: 72%;
    top: 50%;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--text-primary);
    border: 2px solid var(--surface-card);
    transform: translate(-50%, -50%);
  }
</style>
</head>
<body>

  <!-- Quiet Cartographic Archipelago Viewport -->
  <div class="viewport" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
      <defs>
        <pattern id="graticule" width="72" height="72" patternUnits="userSpaceOnUse">
          <path d="M 72 0 L 0 0 0 72" fill="none" stroke="var(--map-grid)" stroke-width="1" />
        </pattern>
      </defs>
      <rect width="1440" height="900" fill="url(#graticule)" />
      <!-- Schematic Archipelago Landmasses (Sumatra, Java, Kalimantan, Sulawesi, Papua) -->
      <g fill="var(--map-land)" stroke="var(--map-land-stroke)" stroke-width="1.2" stroke-linejoin="round">
        <!-- Sumatra -->
        <path d="M 110 215 L 155 180 L 210 230 L 275 305 L 335 390 L 385 450 L 360 480 L 290 420 L 220 330 L 145 265 Z" />
        <!-- Java -->
        <path d="M 385 505 L 470 515 L 570 528 L 650 538 L 645 558 L 545 552 L 430 535 L 378 522 Z" />
        <!-- Kalimantan -->
        <path d="M 465 250 L 545 210 L 635 225 L 665 290 L 645 385 L 575 415 L 495 395 L 455 340 Z" />
        <!-- Sulawesi -->
        <path d="M 715 275 L 795 255 L 820 285 L 765 320 L 800 375 L 765 405 L 735 360 L 705 335 Z" />
        <!-- Papua -->
        <path d="M 960 325 L 1065 345 L 1185 375 L 1245 435 L 1175 465 L 1070 425 L 990 390 Z" />
      </g>
      <!-- Subtle SiRUP Procurement Arcs (Muted neutral + single Signal Ember lead) -->
      <path d="M 470 520 Q 430 390 295 360" fill="none" stroke="var(--text-muted)" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="4 4" />
      <path d="M 470 520 Q 520 400 565 365" fill="none" stroke="var(--accent)" stroke-opacity="0.65" stroke-width="1.5" />
      <!-- Hotspot Markers (Calm observation points, no glowing orbs) -->
      <circle cx="295" cy="360" r="4" fill="var(--accent)" />
      <circle cx="312" cy="378" r="3" fill="var(--accent)" fill-opacity="0.7" />
      <circle cx="565" cy="365" r="5" fill="var(--accent)" />
      <circle cx="545" cy="342" r="3.5" fill="var(--accent)" fill-opacity="0.75" />
      <circle cx="605" cy="380" r="3" fill="var(--text-secondary)" fill-opacity="0.55" />
    </svg>
  </div>

  <!-- Top Ultra-Quiet Bar -->
  <header class="topbar">
    <div class="hud-group">
      <span class="status-dot" title="PostGIS 3.4 aktif"></span>
      <h1 class="brand">Nusantara Watch</h1>
      <span class="v-sep"></span>
      <div class="telemetry-line mono">
        <span><strong>188</strong> titik api</span>
        <span>·</span>
        <span>1.842 ha</span>
        <span>·</span>
        <span>PostGIS 3.4</span>
      </div>
    </div>

    <div class="hud-group">
      <select class="ctrl-select" aria-label="Filter wilayah">
        <option>Seluruh Indonesia</option>
        <option>Riau</option>
        <option>Jambi</option>
        <option>Sumatera Selatan</option>
        <option>Kalimantan Barat</option>
        <option>Kalimantan Tengah</option>
        <option>Kalimantan Selatan</option>
      </select>
      <button type="button" class="ctrl-btn">Posko BNPB</button>
      <button type="button" class="ctrl-btn">Audit SiRUP</button>
      <button type="button" id="theme-toggle" class="ctrl-btn">Tema: Terang</button>
    </div>
  </header>

  <!-- Right Panel: Hotspot Inspector Empty State with Live Hairline Stage -->
  <aside class="inspector" aria-label="Inspektor Titik Api">
    <div class="inspector-head">
      <div>
        <h2 class="inspector-title">Inspektor titik api</h2>
        <p class="inspector-sub">Belum ada titik dipilih pada peta</p>
      </div>
      <span class="meta-pill mono">Siaga</span>
    </div>

    <div class="inspector-body">
      <div class="seg-track" role="tablist" aria-label="Pilih konsep Hairline">
        <button type="button" class="seg-btn mono" role="tab" data-fig="peat-table" aria-selected="true">01 peat-table</button>
        <button type="button" class="seg-btn mono" role="tab" data-fig="canal-locks" aria-selected="false">02 canal-locks</button>
        <button type="button" class="seg-btn mono" role="tab" data-fig="sortie-deck" aria-selected="false">03 sortie-deck</button>
      </div>

      <div class="plate-wrap">
        <div class="plate">
          <span class="plate-tag mono" id="hl-name">peat-table</span>
          <span class="plate-tag mono" id="hl-read">rest</span>
          <div id="stage"></div>
        </div>
        <div class="plate-controls">
          <button type="button" id="hl-play" class="mini-btn mono" aria-pressed="false">play tour</button>
          <label for="hl-range" class="mono">intensitas</label>
          <input id="hl-range" type="range" min="0" max="1" step="0.01" value="0.5" />
          <span id="hl-val" class="mono" style="font-size:11px; color:var(--text-secondary); min-width:3ch; text-align:right;">3</span>
        </div>
        <p id="hl-means" class="means-line"></p>
      </div>

      <div class="summary-grid">
        <div class="stat-cell">
          <span class="stat-label">Titik aktif</span>
          <span class="stat-val accent mono">188</span>
        </div>
        <div class="stat-cell">
          <span class="stat-label">Di konsesi</span>
          <span class="stat-val mono">64%</span>
        </div>
        <div class="stat-cell">
          <span class="stat-label">Pagu SiRUP</span>
          <span class="stat-val mono">Rp 42,8 M</span>
        </div>
      </div>

      <div class="hint-box">
        <span>Klik pin titik api pada peta untuk menginspeksi konsesi &amp; PM2.5</span>
        <span class="kbd mono">Esc</span>
      </div>
    </div>
  </aside>

  <!-- Bottom Ultra-Quiet Bar -->
  <div class="bottombar">
    <div class="dock">
      <div class="layers">
        <button type="button" class="layer-btn" aria-pressed="true"><span class="layer-dot hot"></span>Titik api <span class="kbd mono">1</span></button>
        <button type="button" class="layer-btn" aria-pressed="true"><span class="layer-dot peat"></span>Gambut <span class="kbd mono">2</span></button>
        <button type="button" class="layer-btn" aria-pressed="true"><span class="layer-dot sirup"></span>SiRUP <span class="kbd mono">3</span></button>
        <button type="button" class="layer-btn" aria-pressed="false"><span class="layer-dot"></span>Angin <span class="kbd mono">4</span></button>
      </div>
      <span class="v-sep"></span>
      <div class="scrubber">
        <button type="button" class="mini-btn mono">Putar</button>
        <span class="mono" style="font-size:12px; color:var(--text-secondary); white-space:nowrap;">14 Nov</span>
        <div class="track" aria-label="Lini masa 7 hari">
          <div class="track-fill"></div>
          <div class="track-thumb"></div>
        </div>
        <span class="mono" style="font-size:11px; color:var(--text-muted); white-space:nowrap;">Akumulatif</span>
      </div>
    </div>
  </div>

<script id="hl-kernel">
/* hairline kernel sha256:346b48bdef2cdfafd5343eba01494255cf75f9c078e6fcd1aafc62bab62980a1 */
/*
 * HL: everything a figure may call. Read this index; the code under it is the
 * package's src/core, unchanged, and a figure should not need to read it.
 *
 * Every figure is drawn in a 400 × 320 viewBox. World space is x/y on the
 * ground and z up. Plates are filled with the ground colour and painted back
 * to front, so a nearer one covers a farther one: append in that order. At
 * the default camera, Cam(45, 0.5, S), +x runs down to the right and +y down
 * to the left, so the corner with the largest x and y is nearest the viewer:
 * append by ascending x + y, from the far corner (smallest x and y) to it.
 *
 * Camera
 *   Cam(azDeg, k, S)                       a camera: azimuth in degrees, k = sin(elevation) (0.5 is the 2:1 view), S = scale
 *   fit(C, points, cx, cy)                 centres the box of [x, y, z] points on (cx, cy); call it once, before proj
 *                                          it only centres, it never scales: choose S by trying values, with the most extreme pose in points.
 *                                          The six figures use S 1.42 to 2.12; the boxes they fit come out 230 to 310 wide and 180 to 245 tall
 *   proj(C)                                returns P(x, y, z), which gives [sx, sy]
 *   unproj(C, sx, sy, z)                   the world [x, y] under a screen point, on the plane at height z
 *   facing(C)                              returns front(sample): whether a ring sample faces the camera
 * Rounded solids
 *   rrect(u0, v0, u1, v1, r, n)            a rounded rectangle, as a ring of samples {u, v, nu, nv}
 *   circ(R, n)                             a circle, as a ring
 *   rings(x0, y0, x1, y1, r, b)            [ring, inner]: a rounded footprint and its crease ring, inset by b
 *                                          r, the corner radius, is cut to half the shorter side. b, the crease's inset in world units
 *                                          (0.6 to 2.2 in the figures), must stay under half the shorter side or the crease turns inside out

      }
      bays.push({
        idx, i, j, cx, cy, h0, ring, inner, el, circle, cross, dots,
        z: tween(h0), lastZ: NaN,
      });
    }
  }

  // Front apron beacon cleats (6) painted after the bays.
  for (let i = 0; i < 6; i++) {
    const bx = i * (EX / 6) + 5;
    const [cr, ci] = rings(bx, EY + 3.5, bx + 10, EY + 8, 1.5, 0.5);
    put(solid(g), prism(P, front, cr, ci, 0, 3.5));
  }

  function drawBay(b, h, activeIdx) {
    const isHi = b.idx === activeIdx;
    b.el.sil.classList.toggle("hi", isHi);
    b.circle.classList.toggle("hi", isHi);
    b.circle.classList.toggle("lo", !isHi);
    b.cross.classList.toggle("hi", isHi);
    b.cross.classList.toggle("lo", !isHi);
    b.dots.forEach((el, d) => el.setAttribute("class", isHi ? (d === 1 ? "dot" : "dot m") : "dot off"));
    if (h === b.lastZ) return;
    b.lastZ = h;
    put(b.el, prism(P, front, b.ring, b.inner, 0, h));
    const shifted = padRing.map((q) => ({ u: q.u + b.cx, v: q.v + b.cy, nu: q.nu, nv: q.nv }));
    b.circle.setAttribute("d", poly(ringAt(P, shifted, h)));
    b.cross.setAttribute("d",
      seg(P(b.cx - 4.5, b.cy, h), P(b.cx + 4.5, b.cy, h)) +
      seg(P(b.cx, b.cy - 4.5, h), P(b.cx, b.cy + 4.5, h)),
    );
    b.dots.forEach((el, d) => place(el, P(b.cx + (d - 1) * 4.5, b.cy + PAD / 2 - 4, h)));
  }

  let act = -1;
  const B = register(stage, (_dt, now) => {
    let moving = false;
    const hiIdx = act >= 0 ? act : REST_PEAK;
    for (const b of bays) {
      drawBay(b, tval(b.z, now), hiIdx);
      if (!tdone(b.z, now)) moving = true;
    }
    return moving;
  });
  bag.add(B.unregister);

  // Rule 01 for stepped heights: unproject onto each bay's static rest top.
  function hit([sx, sy]) {
    let best = -1, bestDist = Infinity;
    for (const b of bays) {
      const w = unproj(C, sx, sy, b.h0);
      const dx = Math.abs(w[0] - b.cx), dy = Math.abs(w[1] - b.cy);
      if (dx <= PAD / 2 + 2 && dy <= PAD / 2 + 2) {
        const dist = Math.hypot(w[0] - b.cx, w[1] - b.cy);
        if (dist < bestDist) { bestDist = dist; best = b.idx; }
      }
    }
    return best;
  }

  function setActive(a) {
    if (a === act) return;
    const now = performance.now();
    const refIdx = a >= 0 ? a : act;
    const refBay = bays.find((b) => b.idx === refIdx) || bays[0];
    act = a;
    for (const b of bays) {
      const dist = Math.hypot(b.i - refBay.i, b.j - refBay.j);
      const delay = Math.round(dist * stag);
      const target = a < 0 ? b.h0 : (b.idx === a ? b.h0 + LIFT : Math.max(5, b.h0 - 4));
      tset(b.z, target, now, delay);
    }
    read.textContent = a < 0 ? "rest" : "pad 0" + (a + 1) + " · 0";
    B.wake();
  }

  bag.add(pointer(stage, { move: (p) => setActive(hit(p)), leave: () => setActive(-1) }));
  bag.add(() => svg.replaceChildren());

  return {
    set: (v) => { stag = v; },
    destroy: bag.dispose,
  };
}

hairline({
  name: "sortie-deck",
  means: "Six helipad bays on an air-ops deck: the bay under the pointer rises while adjacent bays step down.",
  rules: [1, 2, 4, 5, 8, 9],
  range: [0, 45, 90],
  tour: [[148, 162], [202, 130], [262, 168], null],
  mount,
});
  })(registerFig);

  HL.inject(document);

  const stage = document.getElementById("stage");
  const nameEl = document.getElementById("hl-name");
  const readEl = document.getElementById("hl-read");
  const meansEl = document.getElementById("hl-means");
  const slider = document.getElementById("hl-range");
  const valEl = document.getElementById("hl-val");
  const playBtn = document.getElementById("hl-play");
  const themeBtn = document.getElementById("theme-toggle");

  let currentHandle = null;
  let currentTour = null;
  let currentFig = null;

  const atRange = (fig, t) => {
    const [lo, mid, hi] = fig.range;
    return Math.round((t <= 0.5 ? lo + (t / 0.5) * (mid - lo) : mid + ((t - 0.5) / 0.5) * (hi - mid)) * 100) / 100;
  };

  const readProxy = {
    _v: "rest",
    get textContent() { return this._v; },
    set textContent(v) { this._v = v == null ? "" : String(v); readEl.textContent = this._v; },
  };

  function mountFigure(name) {
    if (currentTour) { currentTour.stop(); currentTour = null; }
    playBtn.setAttribute("aria-pressed", "false");
    if (currentHandle) { currentHandle.destroy(); currentHandle = null; }
    stage.replaceChildren();

    const fig = FIGURES[name];
    currentFig = fig;
    stage.setAttribute("data-hairline", fig.name);
    const svg = HL.mk("svg", { viewBox: "0 0 400 320", "aria-hidden": "true" }, stage);

    nameEl.textContent = fig.name;
    meansEl.textContent = fig.means;
    readProxy.textContent = "rest";

    const v = atRange(fig, Number(slider.value));
    valEl.textContent = String(v);
    currentHandle = fig.mount({ stage, svg, read: readProxy }, v);

    document.querySelectorAll(".seg-btn").forEach((b) => {
      b.setAttribute("aria-selected", String(b.dataset.fig === name));
    });
  }

  slider.addEventListener("input", () => {
    if (!currentFig || !currentHandle) return;
    const v = atRange(currentFig, Number(slider.value));
    valEl.textContent = String(v);
    currentHandle.set(v);
  });

  playBtn.addEventListener("click", () => {
    if (!currentFig) return;
    const active = playBtn.getAttribute("aria-pressed") === "true";
    if (active) {
      if (currentTour) currentTour.stop();
      currentTour = null;
      playBtn.setAttribute("aria-pressed", "false");
    } else {
      currentTour = HL.tour(stage, currentFig.tour || HL.LAP);
      playBtn.setAttribute("aria-pressed", "true");
    }
  });

  document.querySelectorAll(".seg-btn").forEach((btn) => {
    btn.addEventListener("click", () => mountFigure(btn.dataset.fig));
  });

  const applyTheme = (mode) => {
    document.documentElement.dataset.theme = mode;
    themeBtn.textContent = mode === "dark" ? "Tema: Terang" : "Tema: Gelap";
  };
  themeBtn.addEventListener("click", () => {
    applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });

  const params = new URLSearchParams(location.search);
  if (params.get("theme") === "light") applyTheme("light");
  const initFig = params.get("fig") && FIGURES[params.get("fig")] ? params.get("fig") : "peat-table";
  mountFigure(initFig);
})();
</script>
