# Martin Vector Tile Server Configuration for Nusantara Watch PostGIS
keep_alive: 75
worker_processes: 2
listen_addresses: '0.0.0.0:3000'

postgres:
  connection_string: ${DATABASE_URL}
  default_srid: 4326
  auto_publish:
    tables:
      from_schemas:
        - spatial
        - bnpb
      id_format: '{schema}.{table}'
    functions: false
